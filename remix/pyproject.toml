[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remix-brain"
version = "0.2.0"
description = "Two-brain desktop companion daemon (vitals, awareness, memory, TTS/STT, Godot v2 WebSocket server)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "psutil==7.2.2",
  "websockets==17.4",
  "numpy==2.5.4",
  "av==19.0.2",
  "onnxruntime==1.31.1",
]

[project.optional-dependencies]
tui = ["textual==8.2.8"]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
