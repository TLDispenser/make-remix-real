  <title>Eyes Closed (Thunking)</title>
  <g id="Layer_1">
    <rect x="0" y="0" width="1920" height="1080" class="cls-1"/>
    <!-- PROP UNIT: the loading spinner, lower-right of the face window.
         ONE continuous ring band (inner r 58, outer r 100) sweeping 300
         degrees with a 60-degree notch (cls-5 = spin). The notch spans
         [90,150) exactly, so the shape's bbox stays hub-symmetric and the
         engine (which spins props about their bbox center) turns it dead
         smooth. Polygon: 21 outer pts top-down + 21 inner pts back up. -->
    <polygon points="1573.40,905.00 1563.41,880.88 1560.00,855.00 1563.41,829.12 1573.40,805.00 1589.29,784.29 1610.00,768.40 1634.12,758.41 1660.00,755.00 1685.88,758.41 1710.00,768.40 1730.71,784.29 1746.60,805.00 1756.59,829.12 1760.00,855.00 1756.59,880.88 1746.60,905.00 1730.71,925.71 1710.00,941.60 1685.88,951.59 1660.00,955.00 1660.00,913.00 1675.01,911.02 1689.00,905.23 1701.01,896.01 1710.23,884.00 1716.02,870.01 1718.00,855.00 1716.02,839.99 1710.23,826.00 1701.01,813.99 1689.00,804.77 1675.01,798.98 1660.00,797.00 1644.99,798.98 1631.00,804.77 1618.99,813.99 1609.77,826.00 1603.98,839.99 1602.00,855.00 1603.98,870.01 1609.77,884.00" class="cls-5"/>
    <!-- closed lids: flat top bar, tapering tail toward the outer side
         (same wedge the reference draws, sampled along the same curve).
         CRITICAL ribbon layout: the rungs are HORIZONTAL cross-sections
         stacked BOTTOM-TO-TOP, matching how the eye shapes stack their
         rungs. Rung k pairs the left/right point of the wedge at one
         height. That way the morph into/out of open eyes (whose rungs are
         also bottom-to-top) is a near-vertical squash -- the way lids
         actually close -- instead of the old vertical-rung layout, whose
         rungs had to rotate 90 degrees mid-morph (the eyes spun shut). -->
    <polygon points="765.863,549.566 751.2,544.8 733.5,540.1 709.5,535.2 700.076,530.434 875.766,530.434 875.766,535.2 875.766,540.1 875.766,544.8 875.766,549.566" class="cls-2"/>
    <polygon points="1154.137,549.566 1168.8,544.8 1186.5,540.1 1210.5,535.2 1219.924,530.434 1044.234,530.434 1044.234,535.2 1044.234,540.1 1044.234,544.8 1044.234,549.566" class="cls-2"/>
  </g>
