  <title>Eyes Closed (Thunking)</title>
  <g id="Layer_1">
    <rect x="0" y="0" width="1920" height="1080" class="cls-1"/>
    <!-- PROP UNIT: the loading spinner, UPPER-LEFT of the face (matches the
         reference PNG: ring at (175.5,165.5), outer r 58, inner r 30, a
         54-degree notch facing up-right (spans 18..72 deg), rounded caps
         (r 14). cls-5 = spin. The band's bbox is the full ring's bbox, so
         the engine's bbox-center hub is the true center and it turns dead
         smooth. 52 pts: 21 outer + 5 + 5 cap + 21 inner. -->
    <polygon points="193.42,110.34 178.23,107.56 162.85,108.90 148.36,114.24 135.80,123.22 126.05,135.20 119.80,149.32 117.51,164.59 119.32,179.92 125.12,194.24 134.49,206.51 146.76,215.88 161.08,221.68 176.41,223.49 191.68,221.20 205.80,214.95 217.78,205.20 226.76,192.64 232.10,178.15 233.44,162.77 230.66,147.58 226.71,141.50 220.26,138.21 213.02,138.59 206.94,142.54 203.65,148.99 204.03,156.23 205.47,164.09 204.78,172.04 202.01,179.54 197.37,186.04 191.17,191.08 183.87,194.31 175.97,195.50 168.04,194.56 160.64,191.56 154.29,186.71 149.44,180.36 146.44,172.96 145.50,165.03 146.69,157.13 149.92,149.83 154.96,143.63 161.46,138.99 168.96,136.22 176.91,135.53 184.77,136.97 192.01,137.35 198.46,134.06 202.41,127.98 202.79,120.74 199.50,114.29" class="cls-5"/>
    <!-- closed lids: flat top bar, tapering tail toward the outer side
         (same wedge the reference draws, sampled along the same curve).
         CRITICAL ribbon layout: the rungs are HORIZONTAL cross-sections
         stacked BOTTOM-TO-TOP, matching how the eye shapes stack their
         rungs. Rung k pairs the left/right point of the wedge at one
         height. That way the morph into/out of open eyes (whose rungs are
         also bottom-to-top) is a near-vertical squash -- the way lids
         actually close -- instead of the old vertical-rung layout, whose
         rungs had to rotate 90 degrees mid-morph (the eyes spun shut). -->
    <polygon points="765.863,549.566 751.2,544.8 733.5,540.1 709.5,535.2 700.076,530.434 875.766,530.434 875.766,535.2 875.766,540.1 875.766,544.8 875.766,549.566" class="cls-2"/>
